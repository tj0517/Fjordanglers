<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suggest other dates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A2E4D}a:hover{color:#B4532A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #F8FAFB; font-family: Poppins, system-ui, sans-serif; color: #0A2E4D; display: flex; flex-direction: column; position: relative">
  <header style="height: 60px; padding: 0 12px; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-bottom: 1px solid #E3E9EE">
    <a href="Main.dc.html" aria-label="Back to request" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0A2E4D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 16px; font-weight: 600">Other dates</span>
  </header>

  <main style="flex: 1; padding: 20px 20px 140px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600">Which days could you do?</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4A5F73">Pick up to 3 days. We'll offer them to the client and come back to you.</p>
    </div>

    <div style="display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; border: 1.5px dashed #E67E50; font-size: 13px">
      Client asked: <strong style="font-weight: 600">14–15 Jan</strong>
    </div>

    <section aria-label="January 2027" style="background: #FFFFFF; border: 1px solid #E3E9EE; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border: none; background: transparent; color: #0A2E4D; display: flex; align-items: center; justify-content: center; border-radius: 10px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        </button>
        <span style="font-size: 16px; font-weight: 600">January 2027</span>
        <button type="button" aria-label="Next month" style="width: 44px; height: 44px; border: none; background: transparent; color: #0A2E4D; display: flex; align-items: center; justify-content: center; border-radius: 10px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12px; color: #4A5F73; text-align: center">
        <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="35">
          <sc-if value="{{ d.blank }}" hint-placeholder-val="{{ false }}">
            <span></span>
          </sc-if>
          <sc-if value="{{ d.real }}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{ d.pick }}" disabled="{{ d.busy }}" aria-label="{{ d.label }}" aria-pressed="{{ d.selected }}" style="{{ d.style }}">{{ d.n }}</button>
          </sc-if>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 14px; padding-top: 4px; font-size: 12px; color: #4A5F73">
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #0A2E4D"></span>Your pick</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; border: 1.5px dashed #E67E50; box-sizing: border-box"></span>Client asked</span>
        <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #E3E9EE"></span>Busy in your calendar</span>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="note" style="font-size: 14px; font-weight: 600">Anything to add? <span style="font-weight: 400; color: #4A5F73">(optional)</span></label>
      <textarea id="note" rows="3" placeholder="e.g. 16th only half day, river is better after the 18th" style="font-family: inherit; font-size: 14px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #C9D3DC; background: #FFFFFF; color: #0A2E4D; resize: none"></textarea>
    </div>
  </main>

  <footer style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E3E9EE; padding: 14px 20px 24px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #4A5F73; text-align: center">{{ summary }}</span>
    <a href="Done.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #E67E50; color: #0A2E4D; font-size: 17px; font-weight: 600; text-decoration: none">{{ cta }}</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: [16, 17, 20] };
  }
  renderVals() {
    const busy = [6, 7, 11, 12, 13, 22, 23, 24];
    const asked = [14, 15];
    const sel = this.state.selected;
    const days = [];
    for (let i = 0; i < 4; i++) days.push({ blank: true, real: false });
    for (let n = 1; n <= 31; n++) {
      const isBusy = busy.includes(n);
      const isSel = sel.includes(n);
      const isAsked = asked.includes(n);
      let style = 'height: 44px; border-radius: 10px; font-size: 15px; font-family: inherit; display: flex; align-items: center; justify-content: center; box-sizing: border-box; ';
      if (isSel) style += 'background: #0A2E4D; color: #FFFFFF; font-weight: 600; border: none;';
      else if (isBusy) style += 'background: #E3E9EE; color: #4A5F73; border: none; text-decoration: line-through;';
      else if (isAsked) style += 'background: #FFFFFF; color: #0A2E4D; border: 1.5px dashed #E67E50; font-weight: 600;';
      else style += 'background: #FFFFFF; color: #0A2E4D; border: 1px solid #E3E9EE;';
      days.push({
        blank: false, real: true, n, busy: isBusy, selected: isSel, style,
        label: n + ' January' + (isBusy ? ', busy' : '') + (isAsked ? ', client asked' : ''),
        pick: () => {
          const cur = this.state.selected;
          if (cur.includes(n)) this.setState({ selected: cur.filter((x) => x !== n) });
          else if (cur.length < 3) this.setState({ selected: [...cur, n].sort((a, b) => a - b) });
        }
      });
    }
    const list = sel.map((n) => n + ' Jan').join(', ');
    return {
      days,
      summary: sel.length ? 'Selected: ' + list : 'No days selected yet',
      cta: sel.length ? 'Send ' + sel.length + (sel.length === 1 ? ' date' : ' dates') : 'Pick at least 1 day'
    };
  }
}
</script>
</body>
</html>
