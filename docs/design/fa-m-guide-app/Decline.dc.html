<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decline request</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A2E4D}a:hover{color:#B4532A}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8FAFB; font-family: Poppins, system-ui, sans-serif; color: #0A2E4D; display: flex; flex-direction: column; position: relative">
  <header style="height: 60px; padding: 0 12px; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-bottom: 1px solid #E3E9EE">
    <a href="Main.dc.html" aria-label="Back to request" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0A2E4D">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <span style="font-size: 16px; font-weight: 600">Decline</span>
  </header>

  <main style="flex: 1; padding: 20px 20px 160px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600">Can't take Taupō, 14–15 Jan?</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4A5F73">No problem. A quick reason helps us send you better matches. Optional.</p>
    </div>

    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 10px">Reason</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ reasons }}" as="r" hint-placeholder-count="5">
          <button type="button" onClick="{{ r.pick }}" aria-pressed="{{ r.selected }}" style="{{ r.style }}">{{ r.label }}</button>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="why" style="font-size: 14px; font-weight: 600">Note for FjordAnglers <span style="font-weight: 400; color: #4A5F73">(optional)</span></label>
      <textarea id="why" rows="4" placeholder="e.g. booked through my own website that week" style="font-family: inherit; font-size: 14px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #C9D3DC; background: #FFFFFF; color: #0A2E4D; resize: none"></textarea>
    </div>
  </main>

  <footer style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E3E9EE; padding: 14px 20px 24px; display: flex; flex-direction: column; gap: 10px">
    <a href="Done.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #0A2E4D; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none">Decline request</a>
    <a href="OtherDates.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; color: #0A2E4D; font-size: 15px; font-weight: 500">Suggest other dates instead</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'booked' };
  }
  renderVals() {
    const list = [
      { id: 'booked', label: 'Already booked' },
      { id: 'water', label: 'Not my water or style' },
      { id: 'group', label: 'Group too big' },
      { id: 'notice', label: 'Too short notice' },
      { id: 'other', label: 'Other' }
    ];
    const reasons = list.map((r) => {
      const selected = this.state.picked === r.id;
      const style = 'min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-family: inherit; ' +
        (selected ? 'background: #0A2E4D; color: #FFFFFF; border: 1.5px solid #0A2E4D; font-weight: 600;' : 'background: #FFFFFF; color: #0A2E4D; border: 1.5px solid #C9D3DC;');
      return { ...r, selected, style, pick: () => this.setState({ picked: selected ? null : r.id }) };
    });
    return { reasons };
  }
}
</script>
</body>
</html>
